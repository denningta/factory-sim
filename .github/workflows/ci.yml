name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

  compose-smoke:
    # Starts the real stack (#42): the image builds, Postgres becomes healthy, the app
    # starts and answers /health. Supersedes the old main-only image build.
    name: compose smoke
    needs: check
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: ci-smoke
    steps:
      - uses: actions/checkout@v6
      - name: Prepare .env from .env.example
        run: |
          cp .env.example .env
          # A real secret, so this keeps passing once startup refuses the placeholder (#43).
          sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .env
      - name: Start stack and wait for healthchecks
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: /health answers on the published port
        run: curl -fsS "http://localhost:$(sed -n 's/^APP_PORT=//p' .env)/health"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
